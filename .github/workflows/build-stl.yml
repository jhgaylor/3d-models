name: Build models

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install OpenSCAD (nightly, for the Manifold backend)
        run: |
          # Ubuntu's openscad is 2021.01 (CGAL only), far too slow for the
          # Boston lid. Use the official nightly from OpenSCAD's OBS repo.
          repo=https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$repo/Release.key" | sudo gpg --dearmor -o /etc/apt/keyrings/openscad.gpg
          echo "deb [signed-by=/etc/apt/keyrings/openscad.gpg] $repo/ ./" | sudo tee /etc/apt/sources.list.d/openscad.list
          sudo apt-get update
          sudo apt-get install -y openscad-nightly xvfb
          echo "OPENSCAD=openscad-nightly" >> "$GITHUB_ENV"

      - name: Build (STL + 3MF + previews, manifold-checked)
        run: xvfb-run -a python3 tools/build.py

      - name: Upload models artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: models
          path: |
            build/**/*.stl
            build/**/*.3mf
          if-no-files-found: error

      - name: Attach STL + 3MF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            build/**/*.stl
            build/**/*.3mf
          generate_release_notes: true
