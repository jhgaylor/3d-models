name: Build models

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Build (STL + 3MF + previews, manifold-checked)
        run: xvfb-run -a python3 tools/build.py

      - name: Upload models artifact
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            build/**/*.stl
            build/**/*.3mf
          if-no-files-found: error

      - name: Attach STL + 3MF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.stl
            build/**/*.3mf
          generate_release_notes: true
